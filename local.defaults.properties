# Safe fallback values for Android Secrets Gradle Plugin.
# Values must be non-empty so generated Java BuildConfig string literals remain valid.
# Replace these only in the ignored root secrets.properties file for local integrations.
GEMINI_API_KEY=NOT_CONFIGURED
S3_ACCESS_KEY_ID=NOT_CONFIGURED
S3_BUCKET_NAME=NOT_CONFIGURED
S3_ENDPOINT=NOT_CONFIGURED
S3_SECRET_ACCESS_KEY=NOT_CONFIGURED
