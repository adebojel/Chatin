name: Build APK Chatin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install || true
          npm install @capacitor/cli @capacitor/core @capacitor/android || true

      - name: Downgrade BouncyCastle - FIX ERROR MAJOR 65
        run: |
          # Cari semua build.gradle.kts yang pakai bcprov 1.79
          find . -name "*.gradle*" -type f -exec sed -i 's/bcprov-jdk18on:1.79/bcprov-jdk18on:1.78.1/g' {} \;
          find . -name "*.gradle*" -type f -exec sed -i 's/bcprov-jdk15on:1.79/bcprov-jdk15on:1.78.1/g' {} \;
          # Atau force exclude MLKEM
          echo "Fixed BouncyCastle version"

      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          ./gradlew clean || true
          chmod +x gradlew

      - name: Add and Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Build APK Debug
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64 --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
