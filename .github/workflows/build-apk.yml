name: Build APK Chatin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install || true
          npm install @capacitor/cli @capacitor/core @capacitor/android || true

      - name: FORCE Downgrade BouncyCastle in ALL Gradle files - FIX MAJOR 65
        run: |
          echo "=== Sebelum fix ==="
          grep -r "bcprov" --include="*.gradle*" --include="*.toml" . || echo "tidak ketemu bcprov di source, tapi ada di cache"
          
          # 1. Paksa di gradle/libs.versions.toml (Capacitor 6)
          if [ -f "android/gradle/libs.versions.toml" ]; then
            sed -i 's/bcprov.*=.*/bcprov-jdk18on = "1.78.1"/g' android/gradle/libs.versions.toml || true
            sed -i 's/1\.79/1.78.1/g' android/gradle/libs.versions.toml
            cat android/gradle/libs.versions.toml | grep bcprov || true
          fi
          
          # 2. Paksa di android/app/build.gradle.kts - tambah resolutionStrategy
          if [ -f "android/app/build.gradle.kts" ]; then
            echo '
          configurations.all {
              resolutionStrategy {
                  force("org.bouncycastle:bcprov-jdk18on:1.78.1")
                  force("org.bouncycastle:bcpkix-jdk18on:1.78.1")
              }
          }' >> android/app/build.gradle.kts
          fi
          
          # 3. Paksa di android/build.gradle.kts
          if [ -f "android/build.gradle.kts" ]; then
            echo '
          allprojects {
            configurations.all {
              resolutionStrategy {
                force("org.bouncycastle:bcprov-jdk18on:1.78.1")
              }
            }
          }' >> android/build.gradle.kts
          fi
          
          # 4. Hapus cache bcprov 1.79 yang korup
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk18on/1.79 || true
          rm -rf ~/.gradle/caches/jars-9/*bcprov* || true
          rm -rf android/.gradle || true
          rm -rf .gradle || true
          
          echo "=== Sesudah fix ==="

      - name: Add and Sync Capacitor
        run: |
          npx cap sync android || true

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home=/usr/lib/jvm/temurin-17-jdk-amd64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
