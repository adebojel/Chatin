name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><head><title>Chatin</title></head><body><h1>Chatin App</h1></body></html>" > www/index.html
          fi

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Chatin com.example.chatin --web-dir www || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --refresh-dependencies

      - name: Generate Tag Name
        id: tag
        run: echo "tag_name=v1.0.$(date +%s)" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "APK Terbaru (Siap Instal)"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
