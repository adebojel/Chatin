name: Build APK Chatin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 21 - WAJIB UNTUK BC 1.79
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: |
          npm install || true
          npm install @capacitor/cli @capacitor/core @capacitor/android || true

      - name: Upgrade Gradle Wrapper to 8.10 - FIX MAJOR 65
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            ./gradlew wrapper --gradle-version 8.10 || true
            cd ..
          elif [ -f "gradlew" ]; then
            ./gradlew wrapper --gradle-version 8.10 || true
          fi
          # Bersihkan cache lama yang korup
          rm -rf ~/.gradle/caches/jars-9/*bcprov* || true

      - name: Add and Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Build APK Debug with Java 21
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
