name: Build APK Chatin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17 - FIX UTAMA
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android || true

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android || true
          ls -la

      - name: Build APK
        run: |
          # Cek ada folder android atau app
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
