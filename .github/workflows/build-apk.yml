name: Build APK Chatin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install || true
          npm install @capacitor/cli @capacitor/core @capacitor/android || true

      - name: FORCE Downgrade BouncyCastle - FIX MAJOR 65
        run: |
          # Cari dan paksa 1.78.1 di semua file
          find . -name "libs.versions.toml" -exec sed -i 's/1\.79/1.78.1/g' {} \; || true
          find . -name "*.kts" -exec sed -i 's/1\.79/1.78.1/g' {} \; || true
          
          # Tambah force di app/build.gradle.kts kalau ada
          if [ -f "app/build.gradle.kts" ]; then
            grep -q "bcprov" app/build.gradle.kts || echo '
          configurations.all {
              resolutionStrategy {
                  force("org.bouncycastle:bcprov-jdk18on:1.78.1")
                  force("org.bouncycastle:bcpkix-jdk18on:1.78.1")
              }
          }' >> app/build.gradle.kts
          fi
          
          # Hapus cache korup
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk18on/1.79 || true
          rm -rf ~/.gradle/caches/jars-9/*bcprov* || true

      - name: Detect Project Type and Build APK
        run: |
          ls -la
          echo "=== cek struktur ==="
          ls -la app/ || true
          ls -la android/ || true
          
          if [ -f "android/gradlew" ]; then
            echo "Build mode: Capacitor android/"
            cd android
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          elif [ -f "gradlew" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Build mode: Native root + app/"
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          elif [ -f "app/gradlew" ]; then
            echo "Build mode: Native app/gradlew"
            cd app
            chmod +x gradlew || true
            cd ..
            ./gradlew clean assembleDebug --no-daemon --stacktrace || ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew not found! list:"
            find . -name "gradlew" -type f
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
