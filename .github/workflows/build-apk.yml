name: Build APK Chatin
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
      - name: Fix bcprov 1.79 -> 1.78.1
        run: sed -i 's/1\.79/1.78.1/g' gradle/libs.versions.toml || true
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: app/build/outputs/apk/debug/*.apk
