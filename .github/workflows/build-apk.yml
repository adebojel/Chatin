name: Build APK Chatin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install || true
          npm install @capacitor/cli @capacitor/core @capacitor/android || true

      - name: Fix BouncyCastle 1.79 -> 1.78.1
        run: |
          find . -name "*.kts" -o -name "*.gradle" | xargs sed -i 's/1\.79/1.78.1/g' || true
          find . -name "libs.versions.toml" | xargs sed -i 's/1\.79/1.78.1/g' || true
          echo "BC fixed"

      - name: Add and Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android || true
          ls -la
          ls -la android/ || true

      - name: Build APK Debug
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew not found!"
            find . -name "gradlew" -type f
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatin-debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
